  <text x="62" y="129" fill="#fffaf0" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">THURSDAY ARENA</text>
  <text x="64" y="167" fill="#bfd4cf" font-family="Segoe UI,Arial,sans-serif" font-size="22">浏览器自动对战游戏 · 核心玩法示意</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 233) rotate(-7 96 153)"><rect width="185" height="294" rx="18" fill="url(#card)"/><rect x="12" y="12" width="161" height="154" rx="12" fill="#213d49"/><circle cx="93" cy="80" r="35" fill="#81d2c3"/><rect x="58" y="115" width="70" height="50" rx="20" fill="#81d2c3"/><text x="21" y="200" fill="#183746" font-size="21" font-weight="800">BOT 01</text><text x="21" y="232" fill="#4e4b49" font-size="16">角色能力</text><path d="M20 259h144" stroke="#916d5d" opacity=".5"/></g>
    <g transform="translate(242 216)"><rect width="185" height="294" rx="18" fill="#f4efdc"/><rect x="12" y="12" width="161" height="154" rx="12" fill="#365c61"/><rect x="60" y="46" width="65" height="78" rx="19" fill="#f3ac7b"/><circle cx="92" cy="55" r="29" fill="#f3ac7b"/><text x="21" y="200" fill="#183746" font-size="21" font-weight="800">BOT 02</text><text x="21" y="232" fill="#596461" font-size="16">前后站位</text><path d="M20 259h144" stroke="#87928c" opacity=".5"/></g>
    <g transform="translate(415 234) rotate(7 92 148)"><rect width="185" height="294" rx="18" fill="#a4ddd0"/><rect x="12" y="12" width="161" height="154" rx="12" fill="#254a52"/><path d="M56 154v-63l37-46 37 46v63Z" fill="#f8e9bb"/><circle cx="93" cy="89" r="19" fill="#254a52"/><text x="21" y="200" fill="#183746" font-size="21" font-weight="800">BOT 03</text><text x="21" y="232" fill="#3c6965" font-size="16">组建队伍</text><path d="M20 259h144" stroke="#6aa99d" opacity=".7"/></g>
  </g>
  <path d="M650 350h90" stroke="#8bd8cb" stroke-width="5" stroke-linecap="round"/><path d="m724 336 18 14-18 14" fill="none" stroke="#8bd8cb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(781 222)" font-family="Segoe UI,Arial,sans-serif">
