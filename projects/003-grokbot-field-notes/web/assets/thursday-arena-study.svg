<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Thursday Arena 玩法研究示意</title>
  <desc id="desc">选择三张 bot 卡牌，自动对战，三局赢两局。本图由研究仓库绘制，不是原游戏截图。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142b3a"/><stop offset="1" stop-color="#274c55"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#f7e5cc"/><stop offset="1" stop-color="#f0aa79"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071c25" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>
  <path d="M0 390Q300 300 610 390T1200 410V630H0Z" fill="#183a46" opacity=".55"/>
  <g fill="none" stroke="#83cbbf" opacity=".2"><circle cx="968" cy="280" r="220"/><circle cx="968" cy="280" r="270"/><circle cx="968" cy="280" r="320"/></g>
