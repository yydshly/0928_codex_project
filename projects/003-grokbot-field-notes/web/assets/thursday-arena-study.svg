    <text x="31" y="51" fill="#ad6548" font-size="17" font-weight="800" letter-spacing="2">AUTO BATTLE</text>
    <text x="31" y="109" fill="#173644" font-size="37" font-weight="800">自动对战</text>
    <g font-size="23" font-weight="800"><circle cx="52" cy="165" r="23" fill="#5fbca8"/><text x="45" y="173" fill="#fff">1</text><circle cx="125" cy="165" r="23" fill="#5fbca8"/><text x="118" y="173" fill="#fff">2</text><circle cx="198" cy="165" r="23" fill="#d0d8d2"/><text x="191" y="173" fill="#667875">3</text></g>
