<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Grok Bot Field Notes 研究总览</title>
  <desc id="desc">从规则、角色与流程，到工具执行、验证证据和人工把关的闭环示意图。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152b3b"/><stop offset="1" stop-color="#10202d"/></linearGradient>
    <linearGradient id="orange" x2="1"><stop stop-color="#ffb376"/><stop offset="1" stop-color="#f1855d"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1115" cy="70" r="170" fill="#244b57" opacity=".5"/>
  <circle cx="1045" cy="630" r="220" fill="#264453" opacity=".28"/>
  <text x="70" y="95" fill="#ffb376" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="6">PROJECT 003 / FIELD NOTES</text>
  <text x="70" y="165" fill="#f6f3e9" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="47" font-weight="700">让 Agent 的工作可执行、可验证</text>
  <text x="70" y="213" fill="#b6c9ca" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24">第三方实战资料库 · 工作规范与案例 · 固定研究快照</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <rect x="70" y="300" width="235" height="126" rx="18" fill="#274653" stroke="#4f7a81"/>
