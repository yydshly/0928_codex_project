    <rect x="345" y="300" width="235" height="126" rx="18" fill="#274653" stroke="#4f7a81"/>
    <text x="462" y="352" fill="#f7f2e8">调用工具</text><text x="462" y="390" fill="#a9c6c9" font-size="18">现有 Agent 环境</text>
    <rect x="620" y="300" width="235" height="126" rx="18" fill="#274653" stroke="#4f7a81"/>
    <text x="737" y="352" fill="#f7f2e8">验证结果</text><text x="737" y="390" fill="#a9c6c9" font-size="18">复现 · 测试 · 证据</text>
    <rect x="895" y="300" width="235" height="126" rx="18" fill="#274653" stroke="#4f7a81"/>
    <text x="1012" y="352" fill="#f7f2e8">人工把关</text><text x="1012" y="390" fill="#a9c6c9" font-size="18">上线 · 数据 · 权限</text>
