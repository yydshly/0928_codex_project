<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="2160" viewBox="0 0 1600 2160" role="img" aria-labelledby="title desc">
<title id="title">Grok Bot Field Notes 全量理解引导图</title>
<desc id="desc">第三方整理的 Agent 工程案例与模板资料库。图解工具、游戏产品和资料库的关系，八个内容模块，五类沉淀成果，能力边界，具体案例，对有工程经验使用者的有限增量价值，以及按需查阅的使用路径。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .bold{font-weight:700}</style>
