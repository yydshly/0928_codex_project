<text x="1720" text-anchor="end" y="82" font-size="24" fill="#a6b9ff" font-weight="600">AI MONEY MAKER HANDBOOK</text>
<text x="80" y="151" font-size="52" fill="white" font-weight="700" data-max-width="1630">本质：案例收集与思考分析库</text>
<text x="80" y="209" font-size="30" fill="#d6def0" font-weight="400" data-max-width="1640">用场景与方案学习生意思维，围绕实际问题和人的需求扩展可能性。</text>
<text x="80" y="256" font-size="25" fill="#a8b8d7" font-weight="400" data-max-width="1640">444 篇副业章节  ·  70 篇创业问答  ·  31 条首页创业文章外链</text>
