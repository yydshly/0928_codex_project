<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Storm-Breaker 浏览器权限流程示意</title>
  <desc id="desc">访问页面后可读取部分浏览器信息；精确位置、摄像头和麦克风需要浏览器授权，然后信息才可能被提交和展示。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b29"/><stop offset="1" stop-color="#172d3b"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#54d7c0"/><stop offset="1" stop-color="#9af4cc"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#07131f" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="600" rx="26" fill="url(#bg)"/>
  <circle cx="1050" cy="-60" r="290" fill="#315a67" opacity=".23"/>
  <circle cx="70" cy="595" r="235" fill="#2c736d" opacity=".12"/>
  <text x="72" y="94" fill="#83ead4" font-size="18" font-family="Arial, sans-serif" letter-spacing="4">PROJECT 001 / RESEARCH VIEW</text>
  <text x="72" y="161" fill="#f4faf7" font-size="50" font-family="Arial, sans-serif" font-weight="700">网页能看到什么？</text>
  <text x="72" y="209" fill="#a9bfc3" font-size="21" font-family="Arial, sans-serif">Storm-Breaker 的效果与浏览器权限边界</text>
  <g filter="url(#shadow)">
    <rect x="72" y="281" width="286" height="206" rx="20" fill="#203646" stroke="#456271"/>
    <rect x="457" y="281" width="286" height="206" rx="20" fill="#203646" stroke="#456271"/>
    <rect x="842" y="281" width="286" height="206" rx="20" fill="#203646" stroke="#456271"/>
  </g>
  <circle cx="111" cy="326" r="19" fill="#315953"/><text x="104" y="334" fill="#91f3ca" font-size="22" font-family="Arial, sans-serif">1</text>
  <circle cx="496" cy="326" r="19" fill="#315953"/><text x="489" y="334" fill="#91f3ca" font-size="22" font-family="Arial, sans-serif">2</text>
  <circle cx="881" cy="326" r="19" fill="#315953"/><text x="874" y="334" fill="#91f3ca" font-size="22" font-family="Arial, sans-serif">3</text>
  <text x="96" y="390" fill="#f4faf7" font-size="26" font-family="Arial, sans-serif" font-weight="700">访问页面</text>
  <text x="96" y="426" fill="#a9bfc3" font-size="18" font-family="Arial, sans-serif">浏览器与系统环境信息</text>
  <text x="96" y="455" fill="#a9bfc3" font-size="18" font-family="Arial, sans-serif">可被页面读取一部分</text>
  <text x="481" y="390" fill="#f4faf7" font-size="26" font-family="Arial, sans-serif" font-weight="700">请求权限</text>
  <text x="481" y="426" fill="#a9bfc3" font-size="18" font-family="Arial, sans-serif">位置、摄像头、麦克风</text>
  <text x="481" y="455" fill="#a9bfc3" font-size="18" font-family="Arial, sans-serif">由浏览器和用户决定</text>
  <text x="866" y="390" fill="#f4faf7" font-size="26" font-family="Arial, sans-serif" font-weight="700">呈现结果</text>
  <text x="866" y="426" fill="#a9bfc3" font-size="18" font-family="Arial, sans-serif">原项目提交给接收端</text>
  <text x="866" y="455" fill="#a9bfc3" font-size="18" font-family="Arial, sans-serif">本演示只在本机显示</text>
  <path d="M370 384h72m-20-13 20 13-20 13M755 384h72m-20-13 20 13-20 13" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="550" fill="#86a3a8" font-size="17" font-family="Arial, sans-serif">自制研究示意图 · 非原项目截图 · 数据不代表实测结果</text>
</svg>
