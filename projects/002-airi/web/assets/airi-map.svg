<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
  <title id="title">AIRI：角色背后的系统</title><desc id="desc">本仓库独立绘制的架构示意。输入进入 Agent，与角色设定结合，输出到声音、形象和外部行动，环境再回传反馈。不是原版截图或运行结果。</desc>
