    <rect x="55" y="101" width="144" height="87" rx="10" fill="#211b2d" stroke="#66517d"/><text x="74" y="126" fill="#a699bd" font-size="11" letter-spacing="1.5">INPUT</text><text x="74" y="154" fill="#f5f1fb" font-size="20">文字 / 声音</text><text x="74" y="174" fill="#b5aec4" font-size="11">语音识别 · 环境事件</text>
