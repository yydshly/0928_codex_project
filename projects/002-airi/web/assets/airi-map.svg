  <g fill="none" stroke="#524062"><circle cx="363" cy="306" r="142" stroke-dasharray="3 7"/><circle cx="363" cy="306" r="219" stroke-opacity=".55"/></g>
  <g fill="none" stroke="#9578bf" stroke-width="1.5" marker-end="url(#arrow)"><path d="M180 145H227Q242 145 242 160V268H273"/><path d="M363 151V227"/><path d="M453 269H486Q501 269 501 253V151H534"/><path d="M453 332H534"/><path d="M362 386V464"/></g>
