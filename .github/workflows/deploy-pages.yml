name: Deploy research website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/010-antv-infographic/web/package-lock.json
      - name: Build AntV Infographic demo
        working-directory: projects/010-antv-infographic/web
        run: |
          npm ci
          npm run build
      - name: Assemble static site
        run: |
          mkdir -p _site/001-storm-breaker _site/002-airi _site/003-grokbot-field-notes _site/005-tailcat
          cp site/index.html _site/index.html
          cp -R projects/001-storm-breaker/web/. _site/001-storm-breaker/
          cp -R projects/002-airi/web/. _site/002-airi/
          cp -R projects/003-grokbot-field-notes/web/. _site/003-grokbot-field-notes/
          mkdir -p _site/004-ace-step-ui
          cp -R projects/004-ace-step-ui/. _site/004-ace-step-ui/
          cp -R projects/005-tailcat/web/. _site/005-tailcat/
          cp -R projects/005-tailcat/assets/. _site/005-tailcat/assets/
          mkdir -p _site/006-personal-edge-proxy/assets
          cp projects/006-personal-edge-proxy/web/index.html projects/006-personal-edge-proxy/web/styles.css projects/006-personal-edge-proxy/web/app.js _site/006-personal-edge-proxy/
          cp -R projects/006-personal-edge-proxy/web/assets/. _site/006-personal-edge-proxy/assets/
          mkdir -p _site/007-osint-resource-map/assets
          cp projects/007-osint-resource-map/web/index.html projects/007-osint-resource-map/web/styles.css projects/007-osint-resource-map/web/app.js projects/007-osint-resource-map/web/catalog-data.js projects/007-osint-resource-map/web/inventory.js projects/007-osint-resource-map/web/NOTICES.md _site/007-osint-resource-map/
          cp projects/007-osint-resource-map/assets/resource-map.svg _site/007-osint-resource-map/assets/
          cp projects/007-osint-resource-map/web/assets/resource-overview.svg _site/007-osint-resource-map/assets/
          cp projects/007-osint-resource-map/web/assets/resource-overview.png _site/007-osint-resource-map/assets/
          mkdir -p _site/008-ai-money-maker-handbook/assets
          cp projects/008-ai-money-maker-handbook/web/index.html projects/008-ai-money-maker-handbook/web/styles.css projects/008-ai-money-maker-handbook/web/data.js projects/008-ai-money-maker-handbook/web/catalog.js projects/008-ai-money-maker-handbook/web/views.js projects/008-ai-money-maker-handbook/web/app.js projects/008-ai-money-maker-handbook/web/NOTICES.md projects/008-ai-money-maker-handbook/web/UPSTREAM-LICENSE.txt _site/008-ai-money-maker-handbook/
          cp -R projects/008-ai-money-maker-handbook/web/assets/. _site/008-ai-money-maker-handbook/assets/
          mkdir -p _site/009-jev-ultrafast/assets
          cp projects/009-jev-ultrafast/web/index.html projects/009-jev-ultrafast/web/styles.css projects/009-jev-ultrafast/web/app.js _site/009-jev-ultrafast/
          cp projects/009-jev-ultrafast/web/assets/overview.svg _site/009-jev-ultrafast/assets/
          cp projects/009-jev-ultrafast/web/assets/overview.png _site/009-jev-ultrafast/assets/
          mkdir -p _site/010-antv-infographic
          cp -R projects/010-antv-infographic/web/dist/. _site/010-antv-infographic/
          cp projects/010-antv-infographic/assets/native-render.png _site/010-antv-infographic/assets/native-render.png
          mkdir -p _site/012-buzz/assets
          cp projects/012-buzz/web/index.html projects/012-buzz/web/styles.css projects/012-buzz/web/app.js projects/012-buzz/web/UPSTREAM-LICENSE.txt _site/012-buzz/
          cp -R projects/012-buzz/web/assets/. _site/012-buzz/assets/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
