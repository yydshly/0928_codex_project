name: Deploy research website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/001-storm-breaker _site/002-airi _site/003-grokbot-field-notes
          cp site/index.html _site/index.html
          cp -R projects/001-storm-breaker/web/. _site/001-storm-breaker/
          cp -R projects/002-airi/web/. _site/002-airi/
          cp -R projects/003-grokbot-field-notes/web/. _site/003-grokbot-field-notes/
          mkdir -p _site/004-ace-step-ui
          cp -R projects/004-ace-step-ui/. _site/004-ace-step-ui/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
